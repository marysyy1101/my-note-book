<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>个人中心预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eceef1; display: flex; justify-content: center; padding: 36px;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .device {
    position: relative; width: 375px; height: 812px; border-radius: 40px;
    overflow: hidden; box-shadow: 0 26px 60px rgba(0,0,0,.2); background: #f4f5f7;
  }
  /* 750 宽设计稿，整体缩放到 375 */
  .stage { width: 750px; height: 1624px; transform: scale(.5); transform-origin: top left; }
  .stage .profile-page { height: 1624px; }
  .stage .scroll { flex: 1; overflow: hidden; }

  /* 模拟系统状态栏 + 右上角胶囊，只为肉眼校验对齐（真机由系统绘制） */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 88px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 54px; z-index: 4; pointer-events: none;
  }
  .sb-time { font-size: 34px; font-weight: 600; color: #1b1f24; letter-spacing: .5px; }
  .sb-icons { display: flex; align-items: center; gap: 14px; }
  .sb-sig { display: flex; align-items: flex-end; gap: 4px; height: 24px; }
  .sb-sig i { width: 6px; display: block; background: #1b1f24; border-radius: 2px; }
  .sb-sig i:nth-child(1) { height: 8px; }
  .sb-sig i:nth-child(2) { height: 14px; }
  .sb-sig i:nth-child(3) { height: 19px; }
  .sb-sig i:nth-child(4) { height: 24px; }
  .sb-wifi { width: 30px; height: 22px; }
  .sb-batt { width: 46px; height: 24px; border: 3px solid rgba(27,31,36,.85); border-radius: 7px; padding: 3px; }
  .sb-batt i { display: block; height: 100%; width: 72%; background: #1b1f24; border-radius: 2px; }

  .capsule {
    position: absolute; top: 96px; right: 14px; width: 174px; height: 64px;
    border-radius: 32px; background: rgba(255,255,255,.66);
    border: 1px solid rgba(27,31,36,.08);
    display: flex; align-items: center; justify-content: space-evenly;
    box-sizing: border-box;
  }
  .capsule .dots { display: flex; align-items: center; gap: 8px; }
  .capsule .dots i { width: 8px; height: 8px; border-radius: 50%; background: #1b1f24; display: block; }
  .capsule .sep { width: 1px; height: 28px; background: rgba(27,31,36,.12); }
  .capsule .ring { width: 26px; height: 26px; border: 3px solid #1b1f24; border-radius: 50%; position: relative; box-sizing: border-box; }
  .capsule .ring::after { content: ''; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border: 3px solid #1b1f24; border-radius: 50%; }

/* ===== 以下为 src/pages/profile/index.scss 编译结果 ===== */
@charset "UTF-8";
/* 个人中心：无系统导航栏；渐变只铺顶部（导航 + 个人信息 + 概览数字），
   下方内容回归浅灰底，卡片式排布 */
.profile-page {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #f4f5f7;
}

/* ---------- 顶部渐变（绝对定位，不占流式高度） ---------- */
.hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 760px;
  pointer-events: none;
  /* 右上白色高光 + 主渐变：一路淡到页面底色，不留硬边 */
  background: radial-gradient(120% 58% at 84% -18%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 60%), linear-gradient(180deg, #ffe7da 0%, #fff0e9 32%, rgba(255, 240, 233, 0.5) 60%, rgba(244, 245, 247, 0) 90%);
}

/* ---------- 自定义导航 ----------
   高度由 JS 按「状态栏 + 胶囊居中」写成真实 px（见 utils/system.ts），
   这里不写死 height，避免和 border-box 的 padding-top 打架 */
.nav {
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  transition: background-color 0.2s ease, box-shadow 0.2s ease;
}

/* 列表滚到标题下方时给导航一层毛玻璃底，避免文字叠在标题上。
   毛玻璃半径必须用真实 px，而 scss 里的 px 会被转成 rpx，
   所以 blur 由行内样式下发（见 index.tsx），这里只留底色与阴影 */
.nav-solid {
  background: rgba(255, 250, 247, 0.92);
  box-shadow: 0 1px 0 rgba(27, 31, 36, 0.05), 0 6px 18px rgba(27, 31, 36, 0.04);
}

.nav-title {
  font-size: 34px;
  line-height: 1;
  font-weight: 600;
  color: #1b1f24;
  letter-spacing: 1px;
}

/* ---------- 内容区 ---------- */
.scroll {
  position: relative;
  z-index: 2;
  flex: 1;
  min-height: 0;
}

/* ---------- 个人信息 ---------- */
.user {
  display: flex;
  align-items: center;
  /* 左右 28 与下方卡片左边线对齐 */
  padding: 16px 28px 0;
}

.avatar-wrap {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  padding: 4px;
  background: #ffffff;
  box-shadow: 0 10px 26px rgba(220, 96, 48, 0.18);
  flex-shrink: 0;
}

.avatar {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  display: block;
}

.ident {
  flex: 1;
  min-width: 0;
  margin-left: 24px;
}

.name-row {
  display: flex;
  align-items: center;
}

.nickname {
  font-size: 38px;
  font-weight: 600;
  color: #1b1f24;
  line-height: 1.3;
  max-width: 360px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.badge {
  margin-left: 14px;
  padding: 3px 12px;
  border-radius: 8px;
  font-size: 20px;
  line-height: 1.5;
  color: #92500f;
  background: linear-gradient(135deg, #ffe2bd 0%, #ffcb93 100%);
  flex-shrink: 0;
}

.sub {
  display: block;
  margin-top: 10px;
  font-size: 24px;
  color: rgba(27, 31, 36, 0.5);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.gear {
  width: 68px;
  height: 68px;
  margin-left: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.gear:active {
  opacity: 0.55;
}

.gear-img {
  width: 42px;
  height: 42px;
}

/* ---------- 四列概览 ---------- */
.figures {
  display: flex;
  padding: 44px 16px 20px;
}

.fig {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.fig-v {
  font-size: 30px;
  font-weight: 600;
  color: #1b1f24;
  line-height: 1.2;
  white-space: nowrap;
}

.fig-k {
  margin-top: 12px;
  font-size: 22px;
  color: rgba(27, 31, 36, 0.45);
}

/* ---------- 深色结余卡 ---------- */
.balance {
  position: relative;
  overflow: hidden;
  margin: 24px 28px 0;
  padding: 32px 36px 38px;
  border-radius: 28px;
  background: linear-gradient(135deg, #363a42 0%, #23262b 100%);
  box-shadow: 0 16px 34px rgba(28, 32, 38, 0.22);
}

/* 右上角一抹品牌色光晕，避免深色块发死 */
.balance::after {
  content: "";
  position: absolute;
  right: -90px;
  top: -110px;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(242, 107, 58, 0.22) 0%, rgba(242, 107, 58, 0) 72%);
}

.balance-k {
  position: relative;
  z-index: 1;
  font-size: 24px;
  color: rgba(255, 255, 255, 0.62);
}

.balance-v {
  position: relative;
  z-index: 1;
  display: block;
  margin-top: 16px;
  font-size: 56px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 1px;
  line-height: 1.2;
}

/* ---------- 白卡：常用服务 ---------- */
.card {
  margin: 28px 28px 0;
  padding: 8px 28px 4px;
  border-radius: 28px;
  background: #ffffff;
  box-shadow: 0 10px 26px rgba(24, 28, 36, 0.05);
}

.card-title {
  display: block;
  padding: 22px 0 6px;
  font-size: 30px;
  font-weight: 600;
  color: #1b1f24;
}

.menu-row {
  display: flex;
  align-items: center;
  height: 104px;
}

.menu-row:active {
  opacity: 0.7;
}

.menu-icon {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: #fff3ed;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 22px;
  flex-shrink: 0;
}

.menu-img {
  width: 34px;
  height: 34px;
}

.menu-text {
  flex: 1;
  font-size: 29px;
  color: #1b1f24;
}

.menu-value {
  font-size: 24px;
  color: #9aa0a6;
  margin-right: 8px;
}

.menu-arrow {
  width: 26px;
  height: 26px;
  opacity: 0.25;
  flex-shrink: 0;
}

.menu-line {
  height: 1px;
  background: #edeff2;
  margin-left: 86px;
}

.tip-card {
  padding-bottom: 30px;
  /* 最后一个内容块，底部留白要越过凸起按钮（168rpx） */
  margin-bottom: calc(210px + constant(safe-area-inset-bottom));
  margin-bottom: calc(210px + env(safe-area-inset-bottom));
}

.tip-body {
  display: block;
  padding-top: 12px;
  font-size: 25px;
  line-height: 1.68;
  color: #9aa0a6;
}

.tip-foot {
  display: block;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #edeff2;
  font-size: 22px;
  line-height: 1.6;
  color: #a8aeb6;
}

/* ===== 以下为 src/custom-tab-bar/index.scss 编译结果 ===== */
@charset "UTF-8";
/* 自定义 tabBar
   外层 192rpx = 80rpx 凸起区 + 112rpx 条身，凸起按钮完全落在外层盒子里，
   避免自定义组件裁剪溢出；外层 pointer-events: none，
   只有条身与按钮接收点击，凸起区之外的点击仍能落到页面内容上 */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 900;
  display: flex;
  align-items: flex-end;
  height: calc(192px + constant(safe-area-inset-bottom));
  height: calc(192px + env(safe-area-inset-bottom));
  pointer-events: none;
}

.bar {
  pointer-events: auto;
  position: relative;
  display: flex;
  width: 100%;
  height: calc(112px + constant(safe-area-inset-bottom));
  height: calc(112px + env(safe-area-inset-bottom));
  padding-bottom: constant(safe-area-inset-bottom);
  padding-bottom: env(safe-area-inset-bottom);
  background: #ffffff;
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -4px 22px rgba(24, 28, 36, 0.07);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tab:active {
  opacity: 0.7;
}

.tab-icon {
  width: 46px;
  height: 46px;
}

.tab-text {
  margin-top: 8px;
  font-size: 20px;
  line-height: 1;
  color: #9aa0a6;
}

.tab-text.on {
  color: #f26b3a;
  font-weight: 600;
}

/* ---------- 中间凸起按钮 ---------- */
.tab-center {
  justify-content: flex-start;
}

.tab-center:active {
  opacity: 1;
}

/* 白色底座：与条身同色，视觉上是一个「凸起」，同时挡住圆背后的内容 */
.plus-wrap {
  width: 128px;
  height: 128px;
  /* 上提 64rpx，顶到外层盒子的凸起区里 */
  margin-top: -64px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plus {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9d72 0%, #f26b3a 55%, #e2571c 100%);
  box-shadow: 0 10px 22px rgba(242, 107, 58, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}

.tab-center:active .plus {
  transform: scale(0.94);
}

.plus-icon {
  width: 42px;
  height: 42px;
}

.plus-text {
  margin-top: 8px;
  font-size: 20px;
  line-height: 1;
  color: #f26b3a;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="device">
  <div class="stage">
    <div class="profile-page">
      <div class="hero-bg"></div>

      <div class="statusbar">
        <span class="sb-time">9:41</span>
        <span class="sb-icons">
          <span class="sb-sig"><i></i><i></i><i></i><i></i></span>
          <svg class="sb-wifi" viewBox="0 0 30 22" fill="none">
            <path d="M15 19.4 11.6 15.8a4.9 4.9 0 0 1 6.8 0L15 19.4Z" fill="#1b1f24"/>
            <path d="M8.9 13.2a8.9 8.9 0 0 1 12.2 0" stroke="#1b1f24" stroke-width="2.6" stroke-linecap="round"/>

        </span>

      <!-- 状态栏 44 + 导航条 40 = 84（真机由 getNavMetrics() 实时算出） -->
      <div class="nav" style="padding-top:88px;height:168px;">
        <span class="nav-title">个人中心</span>
        <span class="capsule">
          <span class="dots"><i></i><i></i><i></i></span>

          <span class="ring"></span>
        </span>
      </div>

      <div class="scroll">
        <div class="user">
          <div class="avatar-wrap"><img class="avatar" src="../src/assets/icons/ui/avatar.png" alt="" /></div>
          <div class="ident">
            <div class="name-row">
              <span class="nickname">记账用户 8F2A</span>
              <span class="badge">记账人</span>
            </div>

          </div>
          <div class="gear"><img class="gear-img" src="../src/assets/icons/ui/settings.png" alt="" /></div>
        </div>

        <div class="figures">
          <div class="fig"><span class="fig-v">68.00</span><span class="fig-k">今日支出</span></div>

          <div class="fig"><span class="fig-v">12,800.00</span><span class="fig-k">本月收入</span></div>

        <div class="balance">

        <div class="card">
          <span class="card-title">常用服务</span>
          <div class="menu-row">
            <div class="menu-icon"><img class="menu-img" src="../src/assets/icons/ui/edit.png" alt="" /></div>

            <img class="menu-arrow" src="../src/assets/icons/ui/chevron-right.png" alt="" />

          <div class="menu-line"></div>
          <div class="menu-row">
            <div class="menu-icon"><img class="menu-img" src="../src/assets/icons/ui/chart.png" alt="" /></div>
            <span class="menu-text">数据统计</span>
            <img class="menu-arrow" src="../src/assets/icons/ui/chevron-right.png" alt="" />

            <span class="menu-text">关于</span>

        <div class="card tip-card">

          <span class="tip-body">记一笔会自动记录当前时刻（精确到秒，可手动修改）；明细左滑即可删除。</span>

      <div class="tabbar">

</body>
</html>
